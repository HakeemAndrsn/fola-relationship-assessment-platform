<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Gloock";
          src: url("assets/fonts/Gloock-Regular.ttf") format("truetype");
          font-weight: 400;
          font-style: normal;
        }
        @font-face {
          font-family: "Instrument Sans";
          src: url("assets/fonts/InstrumentSans-Regular.ttf") format("truetype");
          font-weight: 400;
          font-style: normal;
        }
        @font-face {
          font-family: "Instrument Sans";
          src: url("assets/fonts/InstrumentSans-SemiBold.ttf") format("truetype");
          font-weight: 600;
          font-style: normal;
        }
        @font-face {
          font-family: "Instrument Sans";
          src: url("assets/fonts/InstrumentSans-Bold.ttf") format("truetype");
          font-weight: 700;
          font-style: normal;
        }

        #root {
          position: absolute;
          inset: 0;
          background: #f3efe6;
          overflow: hidden;
          font-family: "Instrument Sans", sans-serif;
        }

        .s7-center {
          position: absolute;
          left: 50%;
          top: 50%;
          transform: translate(-50%, -50%);
          width: 1200px;
          text-align: center;
        }

        .s7-logo {
          display: block;
          width: 108px;
          height: 108px;
          margin: 0 auto 30px;
          object-fit: contain;
        }

        .s7-cta {
          display: inline-flex;
          align-items: center;
          gap: 16px;
          background: #b4531f;
          border-radius: 100px;
          padding: 26px 56px;
          box-shadow: 0 26px 56px rgba(180, 83, 31, 0.32);
          margin-bottom: 34px;
        }
        .s7-cta-text {
          font-family: "Gloock", serif;
          font-weight: 400;
          font-size: 38px;
          color: #f5f2ec;
        }
        .s7-cta-arrow {
          font-family: "Instrument Sans", sans-serif;
          font-weight: 700;
          font-size: 34px;
          color: #f5f2ec;
        }

        .s7-dualpath {
          display: block;
          font-family: "Instrument Sans", sans-serif;
          font-weight: 600;
          font-size: 26px;
          color: #4a3f37;
          margin-bottom: 26px;
        }
        .s7-dualpath .sep {
          color: #b3a493;
          font-weight: 400;
          margin: 0 6px;
        }

        .s7-domain {
          display: block;
          font-family: "Instrument Sans", sans-serif;
          font-weight: 700;
          font-size: 22px;
          letter-spacing: 0.1em;
          color: #6b4e18;
        }
      </style>

      <div id="root" data-composition-id="scene7-close" data-width="1920" data-height="1080">
        <div class="s7-center">
          <img id="s7-logo" class="s7-logo" src="assets/images/logo-transparent.png" alt="FOLA" />

          <div id="s7-cta" class="s7-cta">
            <span class="s7-cta-text">Couples Assessment &mdash; R600</span>
            <span class="s7-cta-arrow">&rarr;</span>
          </div>

          <span id="s7-dualpath" class="s7-dualpath"
            >Book Breakthrough Session &mdash; R2,800<span class="sep">&middot;</span>or<span class="sep"
              >&middot;</span
            >Book Discovery Call &mdash; Free</span
          >

          <span id="s7-domain" class="s7-domain">lovebetter.co.za</span>
        </div>
      </div>

      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });

          gsap.set("#s7-logo", { opacity: 0, y: -18, scale: 0.9 });
          gsap.set("#s7-cta", { opacity: 0, y: 26, scale: 0.94 });
          gsap.set("#s7-dualpath", { opacity: 0, y: 16 });
          gsap.set("#s7-domain", { opacity: 0 });

          tl.to("#s7-logo", { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power2.out" }, 0);
          tl.to("#s7-cta", { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.5)" }, 0.28);
          tl.to("#s7-dualpath", { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.72);
          tl.to("#s7-domain", { opacity: 1, duration: 0.4, ease: "power1.out" }, 1.0);

          // Everything holds fully still for the remaining ~2.5s+ — nothing competes with the CTA.

          window.__timelines["scene7-close"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
