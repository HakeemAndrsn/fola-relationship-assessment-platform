<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Gloock";
          src: url("assets/fonts/Gloock-Regular.ttf") format("truetype");
          font-weight: 400;
          font-style: normal;
        }
        @font-face {
          font-family: "Instrument Sans";
          src: url("assets/fonts/InstrumentSans-Medium.ttf") format("truetype");
          font-weight: 500;
          font-style: normal;
        }

        #root {
          position: absolute;
          inset: 0;
          background: #1b1917;
          overflow: hidden;
          font-family: "Instrument Sans", sans-serif;
        }

        .s2-headline-wrap {
          position: absolute;
          left: 50%;
          top: 235px;
          transform: translate(-50%, 0);
          width: 1500px;
          text-align: center;
        }

        .s2-headline {
          display: block;
          color: #f3efe6;
          font-family: "Gloock", serif;
          font-weight: 400;
          font-size: 74px;
          line-height: 1.2;
          letter-spacing: -0.01em;
        }

        .s2-cards {
          position: absolute;
          left: 50%;
          top: 560px;
          transform: translate(-50%, 0);
          display: flex;
          gap: 56px;
        }

        .s2-card {
          width: 460px;
          height: 320px;
          border-radius: 20px;
          background: #b4531f;
          box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
          padding: 48px 44px;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: flex-start;
        }

        .s2-card-num {
          font-family: "Gloock", serif;
          font-weight: 400;
          font-size: 104px;
          line-height: 1;
          color: #f5f2ec;
          font-variant-numeric: tabular-nums;
          margin-bottom: 22px;
        }

        .s2-card-label {
          font-family: "Instrument Sans", sans-serif;
          font-weight: 500;
          font-size: 30px;
          line-height: 1.32;
          color: rgba(245, 242, 236, 0.92);
          max-width: 380px;
        }
      </style>

      <div id="root" data-composition-id="scene2-agitation" data-width="1920" data-height="1080">
        <div class="s2-headline-wrap">
          <span id="s2-headline" class="s2-headline">Left alone, it becomes the reason it ends.</span>
        </div>

        <div class="s2-cards">
          <div id="s2-card1" class="s2-card">
            <span class="s2-card-num">6 yrs</span>
            <span class="s2-card-label">Average wait before couples seek help</span>
          </div>
          <div id="s2-card2" class="s2-card">
            <span class="s2-card-num">R1.5&ndash;2k</span>
            <span class="s2-card-label">Per session just to find the problem</span>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });

          gsap.set("#s2-headline", { opacity: 0, y: -24 });
          gsap.set("#s2-card1", { opacity: 0, y: 70, scale: 0.94 });
          gsap.set("#s2-card2", { opacity: 0, y: 70, scale: 0.94 });

          // 1. Headline lands (0 - 0.55s)
          tl.to("#s2-headline", { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0);

          // 2. Stat card 1 lands (1.6s), holds
          tl.to(
            "#s2-card1",
            { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.7)" },
            1.6,
          );

          // 3. Stat card 2 lands (3.1s) — sequential, not simultaneous
          tl.to(
            "#s2-card2",
            { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.7)" },
            3.1,
          );

          window.__timelines["scene2-agitation"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
