<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Gloock";
          src: url("assets/fonts/Gloock-Regular.ttf") format("truetype");
          font-weight: 400;
          font-style: normal;
        }
        @font-face {
          font-family: "Instrument Sans";
          src: url("assets/fonts/InstrumentSans-Regular.ttf") format("truetype");
          font-weight: 400;
          font-style: normal;
        }
        @font-face {
          font-family: "Instrument Sans";
          src: url("assets/fonts/InstrumentSans-SemiBold.ttf") format("truetype");
          font-weight: 600;
          font-style: normal;
        }
        @font-face {
          font-family: "Instrument Sans";
          src: url("assets/fonts/InstrumentSans-Bold.ttf") format("truetype");
          font-weight: 700;
          font-style: normal;
        }

        #root {
          position: absolute;
          inset: 0;
          background: #ece5d8;
          overflow: hidden;
          font-family: "Instrument Sans", sans-serif;
        }

        .s4-stepchip {
          position: absolute;
          left: 50%;
          top: 96px;
          transform: translate(-50%, 0);
          display: flex;
          align-items: center;
          gap: 14px;
          background: #1b1917;
          border-radius: 100px;
          padding: 14px 30px;
        }
        .s4-stepchip-dot {
          width: 9px;
          height: 9px;
          border-radius: 50%;
          background: #c1795a;
        }
        .s4-stepchip-text {
          color: #f3efe6;
          font-family: "Instrument Sans", sans-serif;
          font-weight: 600;
          font-size: 22px;
          letter-spacing: 0.02em;
        }

        .s4-card {
          position: absolute;
          left: 50%;
          top: 50%;
          transform: translate(-50%, -50%) translateY(20px);
          width: 1360px;
          background: #ffffff;
          border: 1px solid #ddd2bf;
          border-radius: 24px;
          padding: 64px 72px 60px;
          box-shadow: 0 40px 90px rgba(27, 25, 23, 0.16);
        }

        .s4-question {
          font-family: "Gloock", serif;
          font-weight: 400;
          font-size: 42px;
          line-height: 1.3;
          color: #1b1917;
          max-width: 1080px;
          margin-bottom: 54px;
        }

        .s4-row {
          margin-bottom: 46px;
        }
        .s4-row:last-child {
          margin-bottom: 0;
        }

        .s4-row-label {
          font-family: "Instrument Sans", sans-serif;
          font-weight: 600;
          font-size: 26px;
          color: #1b1917;
          margin-bottom: 20px;
          display: flex;
          align-items: baseline;
          gap: 10px;
        }
        .s4-row-value {
          font-weight: 700;
          color: #b8654a;
          font-variant-numeric: tabular-nums;
        }

        .s4-track {
          position: relative;
          width: 1216px;
          height: 10px;
          border-radius: 100px;
          background: #e7ddcc;
          overflow: hidden;
        }
        .s4-track-fill {
          position: absolute;
          left: 0;
          top: 0;
          width: 1216px;
          height: 100%;
          border-radius: 100px;
          background: #b8654a;
          transform-origin: left center;
        }
        .s4-thumb {
          position: absolute;
          left: 0;
          top: 50%;
          width: 34px;
          height: 34px;
          margin-left: -17px;
          margin-top: -17px;
          border-radius: 50%;
          background: #ffffff;
          border: 5px solid #b8654a;
          box-shadow: 0 6px 16px rgba(27, 25, 23, 0.22);
        }

        .s4-cursor {
          display: block;
          position: absolute;
          left: 0;
          top: 50%;
          width: 46px;
          height: 46px;
          margin-top: -14px;
          filter: drop-shadow(0 8px 14px rgba(27, 25, 23, 0.35));
        }
      </style>

      <div id="root" data-composition-id="scene4-process" data-width="1920" data-height="1080">
        <div class="s4-stepchip">
          <div class="s4-stepchip-dot"></div>
          <span class="s4-stepchip-text">Communication &middot; Step 7 of 10</span>
        </div>

        <div id="s4-card" class="s4-card">
          <div class="s4-question">
            &ldquo;I find it hard to truly listen without planning my response.&rdquo;
          </div>

          <div class="s4-row">
            <div class="s4-row-label">
              Partner A: <span class="s4-row-value">3/10</span>
            </div>
            <div class="s4-track">
              <div class="s4-track-fill" style="transform: scaleX(0.3)"></div>
              <div class="s4-thumb" data-layout-allow-overflow="true" style="transform: translateX(364.8px)"></div>
            </div>
          </div>

          <div class="s4-row">
            <div class="s4-row-label">
              Partner B: <span id="s4-b-value" class="s4-row-value">6/10</span>
            </div>
            <div class="s4-track">
              <div class="s4-track-fill" id="s4-b-fill"></div>
              <div class="s4-thumb" id="s4-b-thumb" data-layout-allow-overflow="true"></div>
              <svg id="s4-cursor" class="s4-cursor" viewBox="0 0 24 24" data-layout-allow-overflow="true">
                <path
                  d="M4 2 L4 19 L8.5 15.2 L11.2 21.3 L14 20 L11.4 14.1 L17 13.9 Z"
                  fill="#1b1917"
                  stroke="#ffffff"
                  stroke-width="1.1"
                  stroke-linejoin="round"
                />
              </svg>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var TRACK_PX = 1216;

          gsap.set("#s4-card", { opacity: 0, y: 44, scale: 0.97 });

          // Initial state for the tweened Partner-B elements is set here (not in CSS)
          // to avoid a CSS-transform / GSAP-tween conflict on the same property.
          gsap.set("#s4-b-fill", { scaleX: 0.6 });
          gsap.set(["#s4-b-thumb", "#s4-cursor"], { x: 0.6 * TRACK_PX });

          // 1. Card settles in
          tl.to("#s4-card", { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, 0);

          // 2. Live drag: Partner B's slider moves 6 -> 8 over four ticked steps (1.9s - 3.4s)
          var proxy = { v: 6 };
          function applyValue(v) {
            var frac = v / 10;
            gsap.set("#s4-b-fill", { scaleX: frac });
            gsap.set(["#s4-b-thumb", "#s4-cursor"], { x: frac * TRACK_PX });
          }

          tl.to(
            proxy,
            {
              v: 8,
              duration: 2.0,
              ease: "steps(4)",
              onUpdate: function () {
                applyValue(proxy.v);
              },
            },
            1.9,
          );

          // Value label ticks up in sync with the four drag steps
          tl.call(function () { document.getElementById("s4-b-value").textContent = "6.5/10"; }, null, 1.9);
          tl.call(function () { document.getElementById("s4-b-value").textContent = "7/10"; }, null, 2.4);
          tl.call(function () { document.getElementById("s4-b-value").textContent = "7.5/10"; }, null, 2.9);
          tl.call(function () { document.getElementById("s4-b-value").textContent = "8/10"; }, null, 3.4);

          // Small settle pop when the drag completes
          tl.fromTo(
            "#s4-b-thumb",
            { scale: 1 },
            { scale: 1.18, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 },
            3.4,
          );

          window.__timelines["scene4-process"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
