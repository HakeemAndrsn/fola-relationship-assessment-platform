        .s5-card-label {

          font-weight: 400;

        }
        .s5-card-fracture .s5-card-pct {

        .s5-radar-grid {
          fill: none;
          stroke: #d9cfbd;
          stroke-width: 1.5;
        }
        .s5-radar-axis {
          stroke: #d9cfbd;
          stroke-width: 1.5;
        }
        .s5-radar-label {
          font-family: "Instrument Sans", sans-serif;
          font-weight: 600;
          font-size: 19px;
          fill: #5b564c;
          text-anchor: middle;
        }
        .s5-radar-a {
          fill: rgba(193, 121, 90, 0.16);
          stroke: #c1795a;
          stroke-width: 4;
        }
        .s5-radar-b {
          fill: rgba(27, 25, 23, 0.1);
          stroke: #1b1917;
          stroke-width: 4;
        }

        .s5-bg-cam,
        .s5-fg-cam {
          position: absolute;
          inset: 0;
          transform-origin: 50% 50%;
        }

        .s5-fracture-glow {
          position: absolute;
          left: 990px;
          top: 268px;
          width: 850px;
          height: 340px;
          transform: translateY(320px);
          border-radius: 28px;
          background: radial-gradient(ellipse at center, rgba(229, 62, 62, 0.55) 0%, rgba(229, 62, 62, 0) 72%);
          pointer-events: none;
          opacity: 0;
        }

        .hf-grain {
          position: absolute;
          inset: 0;
          opacity: 0.02;
          pointer-events: none;
          z-index: 20;
          background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }
      </style>

      <div id="root" data-composition-id="scene5-reveal" data-width="1920" data-height="1080">
        <div class="s5-bg-cam" data-layout-allow-overflow="true">
        <div class="s5-kicker"><span class="s5-kicker-text">Confidential Clinical Document</span></div>
        <div class="s5-title">FOLA Relational Assessment Report</div>

        <div class="s5-legend">
          <div class="s5-legend-item">
            <div class="s5-legend-swatch" style="background: #c1795a"></div>
            Partner A
          </div>
          <div class="s5-legend-item">
            <div class="s5-legend-swatch" style="background: #1b1917"></div>
            Partner B
          </div>
        </div>

        <div class="s5-radar-wrap">
          <svg width="780" height="780" viewBox="0 0 760 760">
            <path class="s5-radar-grid" d="M 380.0 330.0 L 415.4 344.6 L 430.0 380.0 L 415.4 415.4 L 380.0 430.0 L 344.6 415.4 L 330.0 380.0 L 344.6 344.6 Z" />
            <path class="s5-radar-grid" d="M 380.0 280.0 L 450.7 309.3 L 480.0 380.0 L 450.7 450.7 L 380.0 480.0 L 309.3 450.7 L 280.0 380.0 L 309.3 309.3 Z" />
            <path class="s5-radar-grid" d="M 380.0 230.0 L 486.1 273.9 L 530.0 380.0 L 486.1 486.1 L 380.0 530.0 L 273.9 486.1 L 230.0 380.0 L 273.9 273.9 Z" />
            <path class="s5-radar-grid" d="M 380.0 180.0 L 521.4 238.6 L 580.0 380.0 L 521.4 521.4 L 380.0 580.0 L 238.6 521.4 L 180.0 380.0 L 238.6 238.6 Z" />

            <line class="s5-radar-axis" x1="380" y1="380" x2="380.0" y2="180.0" />
            <line class="s5-radar-axis" x1="380" y1="380" x2="521.4" y2="238.6" />
            <line class="s5-radar-axis" x1="380" y1="380" x2="580.0" y2="380.0" />
            <line class="s5-radar-axis" x1="380" y1="380" x2="521.4" y2="521.4" />
            <line class="s5-radar-axis" x1="380" y1="380" x2="380.0" y2="580.0" />
            <line class="s5-radar-axis" x1="380" y1="380" x2="238.6" y2="521.4" />
            <line class="s5-radar-axis" x1="380" y1="380" x2="180.0" y2="380.0" />
            <line class="s5-radar-axis" x1="380" y1="380" x2="238.6" y2="238.6" />

            <path id="s5-radar-a" class="s5-radar-a" d="M 380.0 220.0 L 464.9 295.1 L 530.0 380.0 L 493.1 493.1 L 380.0 500.0 L 337.6 422.4 L 240.0 380.0 L 259.8 259.8 Z" />
            <path id="s5-radar-b" class="s5-radar-b" d="M 380.0 210.0 L 486.1 273.9 L 540.0 380.0 L 422.4 422.4 L 380.0 520.0 L 266.9 493.1 L 260.0 380.0 L 266.9 266.9 Z" />

            <text class="s5-radar-label" x="380.0" y="90">Attachment</text>
            <text class="s5-radar-label" x="380.0" y="112">Style</text>
            <text class="s5-radar-label" x="600" y="192">Trauma</text>
            <text class="s5-radar-label" x="600" y="214">Inventory</text>
            <text class="s5-radar-label" x="670" y="376">ADHD</text>
            <text class="s5-radar-label" x="670" y="398">Screening</text>
            <text class="s5-radar-label" x="600" y="560">Values</text>
            <text class="s5-radar-label" x="600" y="582">Alignment</text>
            <text class="s5-radar-label" x="380.0" y="662">Change</text>
            <text class="s5-radar-label" x="380.0" y="684">Readiness</text>
            <text class="s5-radar-label" x="160" y="560">Communi-</text>
            <text class="s5-radar-label" x="160" y="582">cation</text>
            <text class="s5-radar-label" x="94" y="376">Future</text>
            <text class="s5-radar-label" x="94" y="398">Vision</text>
            <text class="s5-radar-label" x="160" y="192">Prejudices</text>
            <text class="s5-radar-label" x="160" y="214">&amp; Biases</text>
          </svg>
        </div>
        </div>

        <div class="s5-fg-cam" data-layout-allow-overflow="true">
          <div id="s5-fracture-glow" class="s5-fracture-glow"></div>
          <div class="s5-cards">
            <div id="s5-card-strength" class="s5-card s5-card-strength">
              <span class="s5-card-kicker">Primary Strength</span>
              <span class="s5-card-label">Attachment Style</span>
              <span class="s5-card-pct">91% alignment</span>
            </div>
            <div id="s5-card-fracture" class="s5-card s5-card-fracture">
              <span class="s5-card-kicker">Critical Fracture Point</span>
              <span class="s5-card-label">Values Alignment</span>
              <span class="s5-card-pct">42% alignment</span>
            </div>
          </div>
        </div>
        <div class="hf-grain"></div>
      </div>

      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });

          gsap.set("#root", { opacity: 0 });
          gsap.set(".s5-kicker, .s5-title", { xPercent: -50, opacity: 0, y: -16 });
          gsap.set(".s5-legend", { opacity: 0, y: -16 });

          var pathA = document.getElementById("s5-radar-a");
          var pathB = document.getElementById("s5-radar-b");
          var lenA = pathA.getTotalLength();
          var lenB = pathB.getTotalLength();
          gsap.set(pathA, { strokeDasharray: lenA, strokeDashoffset: lenA, fillOpacity: 0 });
          gsap.set(pathB, { strokeDasharray: lenB, strokeDashoffset: lenB, fillOpacity: 0 });

          gsap.set(["#s5-card-strength", "#s5-card-fracture"], { opacity: 0, y: 48, scale: 0.94 });
          gsap.set("#s5-fracture-glow", { opacity: 0, scale: 0.92 });

          // Scene fades in cleanly on the cut from Scene 4
          tl.to("#root", { opacity: 1, duration: 0.25, ease: "power1.out" }, 0);
          tl.to(".s5-kicker", { xPercent: -50, opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 0.05);
          tl.to(".s5-title", { xPercent: -50, opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.15);
          tl.to(".s5-legend", { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 0.3);

          // 1. Radar draws in (0.3 - 1.5s) — both partner lines, terracotta then charcoal
          tl.to(pathA, { strokeDashoffset: 0, duration: 0.9, ease: "power2.inOut" }, 0.3);
          tl.to(pathA, { fillOpacity: 1, duration: 0.35, ease: "power1.out" }, 1.0);
          tl.to(pathB, { strokeDashoffset: 0, duration: 0.9, ease: "power2.inOut" }, 0.45);
          tl.to(pathB, { fillOpacity: 1, duration: 0.35, ease: "power1.out" }, 1.15);

          // 2. Hold on the drawn radar (1.5 - 1.7s)

          // 3. Green "Primary Strength" card lands first (1.7s)
          tl.to(
            "#s5-card-strength",
            { opacity: 1, y: 0, scale: 1, duration: 0.42, ease: "back.out(1.6)" },
            1.7,
          );

          // 4. A beat later, the red "Critical Fracture" card lands — the loudest visual moment,
          //    the spring-settle completes exactly at local 3.80s (global 25.8s), matched to the
          //    score's rising swell crest + hard impact hit.
          tl.to(
            "#s5-card-fracture",
            { opacity: 1, y: 0, scale: 1, duration: 0.46, ease: "back.out(1.7)" },
            3.34,
          );

          // 5. A single settle "gut-punch" pulse on the fracture card at the impact —
          //    this is the single most important emotional beat in the video, so it
          //    gets a touch more drama than the strength card: a restrained red glow
          //    pulse plus a slightly stronger scale-punch, both landing exactly on the
          //    score's rising-swell crest + hard impact hit at local 3.8s (global 25.8s).
          tl.fromTo(
            "#s5-card-fracture",
            { scale: 1 },
            { scale: 1.05, duration: 0.16, ease: "power2.out", yoyo: true, repeat: 1 },
            3.8,
          );
          tl.fromTo(
            "#s5-fracture-glow",
            { opacity: 0, scale: 0.92 },
            { opacity: 1, scale: 1.06, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1 },
            3.8,
          );
          // Glow fully clears so it never lingers as a distracting wash under the hold
          tl.to("#s5-fracture-glow", { opacity: 0, duration: 0.5, ease: "power1.out" }, 4.3);

          // Subtle camera drift across the full 8s hold — radar/legend (background)
          // creeps slower than the strength/fracture cards (foreground).
          tl.fromTo(".s5-bg-cam", { scale: 1 }, { scale: 1.022, duration: 8, ease: "none" }, 0);
          tl.fromTo(".s5-fg-cam", { scale: 1 }, { scale: 1.035, duration: 8, ease: "none" }, 0);

          window.__timelines["scene5-reveal"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
